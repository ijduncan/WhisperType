name: Build macOS app

# Builds the Apple silicon DMG for macOS 14 or later. This CI artifact is ad-hoc
# signed so it can be smoke-tested and downloaded from the workflow run, but it
# is deliberately not attached to a public release. Public distribution requires
# a Developer ID Application certificate plus Apple notarization credentials.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build arm64
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify native runner architecture
        run: |
          python - <<'PY'
          import platform
          expected = "arm64"
          actual = platform.machine()
          if actual != expected:
              raise SystemExit(f"expected {expected} runner, got {actual}")
          print(f"Building natively for {actual}")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          bash macos/install_mlx.sh "$(command -v python)"
          python -m pip install "pyinstaller>=6.22.0,<6.23"

      - name: Run unit tests
        shell: bash
        run: |
          python -m unittest discover -s tests -v

      - name: Build app and DMG
        shell: bash
        env:
          WHISPERTYPE_VERSION: ${{ github.ref_name }}
          WHISPERTYPE_BUILD_NUMBER: ${{ github.run_number }}
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: bash ./build_macos.sh

      - name: Verify frozen app
        shell: bash
        run: |
          app="dist/macos/arm64/app/WhisperType.app"
          "$app/Contents/MacOS/WhisperType" --check
          "$app/Contents/MacOS/WhisperType" --overlaytest
          "$app/Contents/MacOS/WhisperType" --menutest
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          bash ./macos/verify_bundle.sh "$app" 14.0

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: WhisperType-macOS-arm64
          path: dist/macos/arm64/WhisperType-macOS-arm64.dmg
          if-no-files-found: error
